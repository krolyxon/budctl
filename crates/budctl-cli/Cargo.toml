[package]
name = "budctl"
description = "Control wireless earbuds from Linux, without the vendor app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "budctl"
path = "src/main.rs"

[dependencies]
budctl-core = { path = "../budctl-core" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
