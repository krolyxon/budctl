[package]
name = "budctl-gui"
description = "Graphical front end for budctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "budctl-gui"
path = "src/main.rs"

[dependencies]
budctl-core = { path = "../budctl-core" }
# Wayland only (no X11) and CPU rendering (no GPU stack): the smallest iced that draws this UI.
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "thread-pool", "crisp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
iced_test = "0.14.0"

[lints]
workspace = true
