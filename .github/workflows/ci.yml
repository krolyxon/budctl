name: CI

# Formatting, lints and tests on every push to master and every pull request.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The core also goes into the Android app (docs/android.md). A check needs no NDK.
      - run: cargo clippy -p budctl-core --target aarch64-linux-android --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: sh -n install.sh
