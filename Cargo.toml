[workspace]
resolver = "3"
members = ["crates/budctl-core", "crates/budctl-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
# The only exception is crates/budctl-core/src/transport/socket.rs (Bluetooth socket syscalls).
unsafe_code = "deny"

[workspace.lints.clippy]
# Bluetooth fails in many ways; every failure must become a typed error, never a panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
